<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Engineering | Aaron Breitbarth</title><link rel="stylesheet" href="../site.css"><nav><a href="../">← Home</a> · <a href="../projects/">Projects</a> · <a href="../field-notes/">Field Notes</a></nav><main><h1>Resume Engineering</h1><p>A transparent keyword coverage aid, not an applicant tracking system or prediction of hiring outcomes. Everything stays in your browser.</p><label>Job requirements (one phrase per line)<textarea id="req" rows="5">territory strategy
coaching
data analysis</textarea></label><label>Resume evidence<textarea id="cv" rows="7" placeholder="Paste anonymized accomplishment statements"></textarea></label><button id="run">Compare evidence</button><section id="out" aria-live="polite">Enter evidence to begin.</section></main><script>document.getElementById('run').onclick=()=>{const norm=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const terms=[...new Set(document.getElementById('req').value.split(/\n/).map(norm).filter(Boolean))];const cv=' '+norm(document.getElementById('cv').value)+' ';const hits=terms.filter(t=>cv.includes(' '+t+' '));const out=document.getElementById('out');out.replaceChildren();const h=document.createElement('h2');h.textContent=terms.length?hits.length+' / '+terms.length+' exact phrases found':'Add at least one requirement';out.append(h);for(const t of terms){const p=document.createElement('p');p.textContent=(hits.includes(t)?'Found: ':'Review: ')+t;out.append(p)}const p=document.createElement('p');p.textContent='Review each match for genuine, relevant evidence. Never add experience you do not have.';out.append(p)}</script></html>
